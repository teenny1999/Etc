name: Build Windows executable

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/zen-mendel-gilkxh
    paths:
      - "count_buildings_msft.py"
      - "count_buildings_msft_gui.py"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install pyinstaller pillow

      - name: Build console executable (CLI / interactive prompt)
        run: pyinstaller --onefile --console --name count_buildings_msft count_buildings_msft.py

      - name: Build windowed GUI executable
        run: pyinstaller --onefile --windowed --name count_buildings_msft_gui count_buildings_msft_gui.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: count_buildings_msft-windows
          path: |
            dist/count_buildings_msft.exe
            dist/count_buildings_msft_gui.exe

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: count_buildings_msft builds (build ${{ github.run_number }})
          files: |
            dist/count_buildings_msft.exe
            dist/count_buildings_msft_gui.exe
          body: |
            Portable Windows builds, produced automatically by this workflow.

            - `count_buildings_msft_gui.exe` - desktop app: enter lat/lon/radius, see the
              building count and a preview map with a marker + radius circle.
            - `count_buildings_msft.exe` - console tool: double-click for an interactive
              prompt, or run from the command line:
              `count_buildings_msft.exe <lat> <lon> --radius 2000`
